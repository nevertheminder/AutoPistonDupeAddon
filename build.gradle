plugins {
    id 'fabric-loom' version '1.17.19'
}

version = '3.1.7'
group = 'me.nevertheminder.autopistondupe'

base {
    archivesName = 'autopistondupe'
}

repositories {
    maven {
        name = "meteor-maven"
        url = "https://maven.meteordev.org/releases"
    }
    maven {
        name = "meteor-maven-snapshots"
        url = "https://maven.meteordev.org/snapshots"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.4"
    mappings "net.fabricmc:yarn:1.21.4+build.7:v2"
    modImplementation "net.fabricmc:fabric-loader:0.16.9"

    modImplementation "meteordevelopment:meteor-client:1.21.4-SNAPSHOT"
    modCompileOnly "meteordevelopment:baritone:1.21.4-SNAPSHOT"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand(
            "version": project.version,
            "jdk_version": "21",
            "minecraft_version": "1.21.4"
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
